name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pandoc
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y pandoc;
          elif [ "$RUNNER_OS" = "macOS" ]; then brew install pandoc;
          else choco install pandoc -y; fi
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q
      - name: Doctor
        run: python -m pal doctor

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the package and install it in a clean environment
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/pal --version && /tmp/clean/bin/pal --help

